<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Opethia Dice</title>
  <style>
    body {
      background-color: #0f0f1b; 
      color: #00ffff; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      justify-content: center;
      user-select: none; 
      overflow: hidden;
    }
    h1 { 
      color: #ff00ff; 
      text-transform: uppercase; 
      letter-spacing: 2px; 
      margin-bottom: 30px;
    }
    
    /* The space where the 3D dice roll happens */
    #dice-stage {
      position: relative;
      width: 160px;
      height: 160px;
      margin: 0 auto 40px auto;
      perspective: 1000px; 
    }

    #svg-wrapper {
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.5));
    }

    /* The actual tumbling animation */
    .tumbling {
      animation: tumble 0.4s infinite linear;
    }

    @keyframes tumble {
      0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
      100% { transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg); }
    }

    /* The number that sits on top of the die */
    #result { 
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 55px; 
      font-weight: bold; 
      color: #fff; 
      text-shadow: 0 0 10px #000, 0 0 15px #ff00ff; 
      z-index: 10;
    }

    /* Adjusts the number slightly up for the triangle d4 so it's centered visually */
    .offset-d4 { margin-top: 10px; }
    .offset-normal { margin-top: 0px; }

    #label { 
      font-size: 20px; 
      color: #8892b0; 
      margin-top: 15px;
      font-weight: bold;
      height: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 400px;
      margin: 0 auto;
    }
    button {
      background-color: #1f1f3a;
      color: #00ffff;
      border: 2px solid #ff00ff;
      border-radius: 12px;
      padding: 15px 10px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation; 
      transition: background-color 0.1s;
    }
    button:active { 
      background-color: #ff00ff; 
      color: #fff; 
    }
  </style>
</head>
<body>

  <h1>Opethia Dice</h1>
  
  <div id="dice-stage">
    <!-- The SVG shape will be injected here -->
    <div id="svg-wrapper"></div>
    <div id="result">-</div>
  </div>
  <div id="label">Awaiting roll...</div>

  <div class="grid" style="margin-top: 30px;">
    <button onclick="roll(4)">d4</button>
    <button onclick="roll(6)">d6</button>
    <button onclick="roll(8)">d8</button>
    <button onclick="roll(10)">d10</button>
    <button onclick="roll(12)">d12</button>
    <button onclick="roll(20)">d20</button>
  </div>

  <script>
    // Pure CSS/SVG geometries for the dice shapes
    const diceSVGs = {
      4: '<svg viewBox="0 0 100 100"><polygon points="50,15 90,85 10,85" fill="#1f1f3a" stroke="#00ffff" stroke-width="4" stroke-linejoin="round"/></svg>',
      6: '<svg viewBox="0 0 100 100"><rect x="15" y="15" width="70" height="70" rx="10" fill="#1f1f3a" stroke="#00ffff" stroke-width="4"/></svg>',
      8: '<svg viewBox="0 0 100 100"><polygon points="50,10 90,50 50,90 10,50" fill="#1f1f3a" stroke="#00ffff" stroke-width="4" stroke-linejoin="round"/><line x1="10" y1="50" x2="90" y2="50" stroke="#00ffff" stroke-width="2"/></svg>',
      10: '<svg viewBox="0 0 100 100"><polygon points="50,10 85,45 50,90 15,45" fill="#1f1f3a" stroke="#00ffff" stroke-width="4" stroke-linejoin="round"/></svg>',
      12: '<svg viewBox="0 0 100 100"><polygon points="50,10 88,38 73,85 27,85 12,38" fill="#1f1f3a" stroke="#00ffff" stroke-width="4" stroke-linejoin="round"/></svg>',
      20: '<svg viewBox="0 0 100 100"><polygon points="50,5 93,25 93,75 50,95 7,75 7,25" fill="#1f1f3a" stroke="#00ffff" stroke-width="4" stroke-linejoin="round"/><polygon points="50,25 78,68 22,68" fill="none" stroke="#00ffff" stroke-width="2" stroke-linejoin="round"/><line x1="7" y1="25" x2="22" y2="68" stroke="#00ffff" stroke-width="2"/><line x1="93" y1="25" x2="78" y2="68" stroke="#00ffff" stroke-width="2"/><line x1="50" y1="5" x2="50" y2="25" stroke="#00ffff" stroke-width="2"/><line x1="50" y1="95" x2="50" y2="68" stroke="#00ffff" stroke-width="2"/></svg>'
    };

    function roll(sides) {
      const finalResult = Math.floor(Math.random() * sides) + 1;
      const resultBox = document.getElementById('result');
      const label = document.getElementById('label');
      const svgWrapper = document.getElementById('svg-wrapper');
      
      // Inject the correct shape and center the text for d4s
      svgWrapper.innerHTML = diceSVGs[sides];
      resultBox.className = (sides === 4) ? 'offset-d4' : 'offset-normal';
      
      label.innerText = `Rolling d${sides}...`;
      label.style.color = '#8892b0';
      resultBox.style.color = '#fff'; 
      
      // Start the 3D tumbling animation
      svgWrapper.classList.add('tumbling');
      
      let ticks = 0;
      const interval = setInterval(() => {
        // Scramble the numbers while spinning
        resultBox.innerText = Math.floor(Math.random() * sides) + 1;
        ticks++;
        
        // Stop after ~600ms
        if (ticks > 15) {
          clearInterval(interval);
          svgWrapper.classList.remove('tumbling'); // Stops the spin
          resultBox.innerText = finalResult;
          
          // Check for Crits and Fails
          if (finalResult === sides) {
            resultBox.style.color = '#00ffff'; // Neon cyan for max damage/crits
            label.innerText = 'CRITICAL HIT!';
            label.style.color = '#00ffff';
          } else if (finalResult === 1 && sides === 20) {
            resultBox.style.color = '#ff0000'; // Red for nat 1
            label.innerText = 'CRITICAL FAIL';
            label.style.color = '#ff0000';
          } else {
            label.innerText = `Rolled a ${finalResult}`;
          }
        }
      }, 40); 
    }

    // Initialize with a d20 shape on screen
    document.getElementById('svg-wrapper').innerHTML = diceSVGs[20];
  </script>
</body>
</html>
