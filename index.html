<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Opethia Dice</title>
  <style>
    body {
      background-color: #0f0f1b; 
      color: #00ffff; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      justify-content: center;
      user-select: none; 
      overflow: hidden;
    }
    h1 { 
      color: #ff00ff; 
      text-transform: uppercase; 
      letter-spacing: 2px; 
      margin-bottom: 30px;
    }
    
    /* The space where the 3D dice roll happens */
    #dice-stage {
      position: relative;
      width: 160px;
      height: 160px;
      margin: 0 auto 40px auto;
      perspective: 1000px; 
    }

    #svg-wrapper {
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.5));
    }

    /* The actual tumbling animation */
    .tumbling {
      animation: tumble 0.4s infinite linear;
    }

    @keyframes tumble {
      0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
      100% { transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg); }
    }

    /* The number that sits on top of the die */
    #result { 
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 55px; 
      font-weight: bold; 
      color: #fff; 
      text-shadow: 0 0 10px #000, 0 0 15px #ff00ff; 
      z-index: 10;
    }

    /* Adjusts the number slightly up for the triangle d4 so it's centered visually */
    .offset-d4 { margin-top: 10px; }
    .offset-normal { margin-top: 0px; }

    #label { 
      font-size: 20px; 
      color: #8892b0; 
      margin-top: 15px;
      font-weight: bold;
      height: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 400px;
      margin: 0 auto;
    }
    button {
      background-color: #1f1f3a;
      color: #00ffff;
      border: 2px solid #ff00ff;
      border-radius: 12px;
      padding: 15px 10px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation; 
      transition: background-color 0.1s;
    }
    button:active { 
      background-color: #ff00ff; 
      color: #fff; 
    }
  </style>
</head>
<body>

  <h1>Opethia Dice</h1>
  
  <div id="dice-stage">
    <!-- The SVG shape will be injected here -->
    <div id="svg-wrapper"></div>
    <div id="result">-</div>
  </div>
  <div id="label">Awaiting roll...</div>

  <div class="grid" style="margin-top: 30px;">
    <button onclick="roll(4)">d4</button>
    <button onclick="roll(6)">d6</button>

    <button onclick="roll(10)">d10</button>
    <button onclick="roll(12)">d12</button>
    <button onclick="roll(20)">d20</button>
  </div>
